[project]
name = "uedemtolc"
version = "0.1.0"
description = "Convert lunar DEM GLTF meshes to Unreal Engine Landscape heightmaps"
readme = "README.md"
authors = [
    { name = "Sam", email = "viragsam@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "scipy>=1.11.0",
    "click>=8.1.0",
]

[project.scripts]
uedemtolc = "uedemtolc.cli:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
